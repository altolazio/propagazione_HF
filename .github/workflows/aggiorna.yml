name: Aggiorna dati INGV

on:
  schedule:
    - cron: '5-59/15 * * * *'   # ogni 15 minuti, a :05 :20 :35 :50, subito dopo le misure INGV (GitHub può ritardare di qualche minuto)
  workflow_dispatch:          # pulsante "Run workflow" per lanciarlo a mano
  push:
    branches: [main]

permissions:
  contents: write     # serve per salvare l'archivio storico nel ramo "archivio"
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: pages
        uses: actions/configure-pages@v5

      - name: Recupera i dati già pubblicati (servono se l'INGV non risponde)
        run: |
          mkdir -p data/img
          BASE="${{ steps.pages.outputs.base_url }}/data"
          for f in rm041.json sp044.json ro041.json gm037d.json cluster.json img/meta.json img/vert-rm041.gif img/vert-sp044.gif \
                   img/obl-Rocca.png img/obl-Aquila.png img/obl-Duronia.png img/obl-CTesino.png img/obl-Lampedusa.png; do
            curl -fsS --max-time 20 "$BASE/$f" -o "data/$f" || rm -f "data/$f"
          done

      - name: Scarica dati e ionogrammi dall'INGV
        run: node scripts/fetch-ingv.mjs

      - name: Leggi gli spot SSB dal DX cluster (IQ1LA-6, login IQ0HL)
        run: node scripts/fetch-cluster.mjs
        continue-on-error: true
        timeout-minutes: 3

      - name: Archivio storico (una volta all'ora, ramo "archivio")
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH="$RUNNER_TEMP/archivio"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" archivio >/dev/null 2>&1; then
            git clone -q --depth 1 --branch archivio "$URL" "$ARCH"
          else
            mkdir -p "$ARCH" && git -C "$ARCH" init -q -b archivio && git -C "$ARCH" remote add origin "$URL"
            cp ARCHIVIO-LEGGIMI.md "$ARCH/LEGGIMI.md" 2>/dev/null || true
            cp ARCHIVIO-CAMBIAMENTI.md "$ARCH/CAMBIAMENTI.md" 2>/dev/null || true
          fi
          node scripts/archivio.mjs "$ARCH"
          cp ARCHIVIO-LEGGIMI.md "$ARCH/LEGGIMI.md" 2>/dev/null || true
          cp ARCHIVIO-CAMBIAMENTI.md "$ARCH/CAMBIAMENTI.md" 2>/dev/null || true
          cd "$ARCH"
          git config user.name "archivio-propagazione"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Archivio $(date -u +%Y-%m-%dT%H:00Z)"
            git push -q origin archivio
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
