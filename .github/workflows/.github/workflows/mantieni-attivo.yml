# GitHub sospende le azioni programmate dei repository senza attività da 60 giorni.
# Questa azione fa un commit vuoto una volta al mese per evitarlo.
name: Mantieni attivo

on:
  schedule:
    - cron: '17 3 1 * *'   # il giorno 1 di ogni mese
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Mantieni attive le azioni programmate"
          git push
