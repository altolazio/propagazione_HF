# Ricevitore WSPR della rete – stazione di ascolto di riferimento IQ0HL – Sezione A.R.I. Alto Lazio
# Dopo una modifica:  sudo systemctl restart ricevitore-wspr
NOMINATIVO=IQ0HL
LOCATORE=JN61AW
# Profilo GIORNO (ore italiane GIORNO_DA-GIORNO_A): 6 bande x 10 minuti
#   :00 40 m  :10 30 m  :20 20 m  :30 17 m  :40 15 m  :50 10 m
GIORNO_DA=7
GIORNO_A=18
BANDE_GIORNO="40m 30m 20m 17m 15m 10m"
MINUTI_GIORNO=10
# Profilo NOTTE: 3 bande x 20 minuti (le bande alte di notte sono chiuse)
#   :00 80 m  :20 40 m  :40 30 m
BANDE_NOTTE="80m 40m 30m"
MINUTI_NOTTE=20
GUADAGNO=40      # usato solo con la V4 (con la V3 in campionamento diretto non conta)
PPM=0            # correzione del quarzo
DIRETTO=2        # 2 = chiavetta V3 (campionamento diretto); 0 = chiavetta V4
