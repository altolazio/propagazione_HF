<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guida alla lettura e consigli – Propagazione HF (A.R.I. Alto Lazio)</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mute:#5f6b78; --line:#dde2e8;
    --open:#1f9d55; --marg:#d9a400; --closed:#c9ced6; --abs:#e07b39; --es:#8a4fd8;
    --foF2:#2f6fdc; --muf:#d23d5b; --med:#8a96a3;
  }
  @media all /* tema scuro per tutti */{
    :root{ --bg:#0f1318; --card:#171c23; --ink:#e7ebf0; --mute:#97a3b0; --line:#2a313b; --closed:#39414c; --med:#6c7783; }
  }
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  header h1{font-size:22px;margin:0 0 2px}
  header p{margin:0;color:var(--mute);font-size:13px}
  header p.disclaimer{color:var(--ink);font-size:14px;margin:4px 0 2px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
  select,button{font:inherit;padding:5px 9px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  button{cursor:pointer}
  .status{font-size:13px;color:var(--mute)}
  .warn{background:#fff3cd;color:#6b5000;border:1px solid #f1d27a;padding:8px 12px;border-radius:8px;margin:8px 0;font-size:14px}
  @media all{.warn{background:#3a3010;color:#f3dd95;border-color:#6b5a1d}}
  .grid{display:grid;gap:12px}
  .grid>*{min-width:0}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .card h2{font-size:16px;margin:0 0 8px}
  .kpi .lab{font-size:12px;color:var(--mute)}
  .kpi .val{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums}
  .kpi .sub{font-size:12px;color:var(--mute)}
  .up{color:var(--open)} .down{color:var(--muf)}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  th,td{padding:5px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:13px}
  th{font-weight:600;color:var(--mute)}
  td.l,th.l{text-align:left}
  td.l{white-space:nowrap}
  .cell{display:inline-block;min-width:64px;padding:3px 6px;border-radius:6px;font-size:12px;font-weight:600;color:#fff}
  .s-open{background:var(--open)} .s-marg{background:var(--marg);color:#222} .s-closed{background:var(--closed);color:var(--mute)}
  .s-abs{background:var(--abs)} .s-es{background:var(--es)} .s-nd{background:transparent;color:var(--mute);border:1px dashed var(--line)}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute);margin-top:8px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
  .chart{width:100%;height:auto;display:block}
  .chart text{fill:var(--mute);font-size:11px}
  .tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;display:none;box-shadow:0 4px 14px rgba(0,0,0,.15);white-space:nowrap}
  .imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
  .imgs figure{margin:0}
  .imgs img{width:100%;border-radius:8px;border:1px solid var(--line);background:#000;min-height:120px;cursor:zoom-in}
  .zoom{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);display:none;overflow:auto;cursor:zoom-out;-webkit-overflow-scrolling:touch}
  .zoom.on{display:block}
  .zoom img{display:block;margin:auto;max-width:none;width:auto;min-width:min(100%,900px);height:auto;max-height:none;border-radius:0;border:0}
  .zoom .cap{position:fixed;left:0;right:0;bottom:0;padding:8px 52px 10px 12px;color:#fff;font-size:13px;background:rgba(0,0,0,.6)}
  .zoom .x{position:fixed;top:10px;right:12px;width:40px;height:40px;border-radius:20px;border:0;background:rgba(255,255,255,.9);color:#000;font-size:22px;line-height:40px;cursor:pointer}
  .imgs figcaption{font-size:12px;color:var(--mute);margin-top:3px}
  .two{grid-template-columns:1fr}
  @media(min-width:900px){.two{grid-template-columns:1fr 1fr}}
  .note{font-size:12px;color:var(--mute)}
  details summary{cursor:pointer;font-weight:600}
  footer{font-size:12px;color:var(--mute);margin:18px 0 6px}
  a{color:var(--foF2)}

  .g-standalone footer{margin-top:12px}
</style>
</head>
<body>
<div class="wrap" id="iono-app">
  <footer>
    Guida del <a href="https://altolazio.github.io/propagazione_HF/" target="_blank" rel="noopener">Progetto sperimentale di previsione della propagazione HF</a> – Sezione A.R.I. Alto Lazio.
    Consigli in parte tratti da: Vittorio IK4CIE, "Propagazione HF – Conoscenze e trucchi per collegamenti DX", A.R.I. Parma.
    Testi e disegni a scopo didattico, senza pretesa di completezza.
  </footer>
</div>
<script>window.GUIDA_STANDALONE = true;</script>
<script src="guida.js"></script>
</body>
</html>
